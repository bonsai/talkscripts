# 知恵の館 1次判定ゲート（常駐wf）
#
# PR ごとに hall-eval (RUBRIC v2) を走らせ、閾値未満なら FAIL。
# ブランチ保護でこの check を required にすると、低スコア PR はマージ阻止される。
#
# 閾値は repo 変数 HALL_THRESHOLD、または下の env で変更可能（既定 65）。
name: hall-eval (1次判定)

on:
  pull_request:
    paths:
      - "知恵の館/**.md"
      - "scripts/hall-eval.py"
      - ".github/workflows/pr-gate.py"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      HALL_THRESHOLD: ${{ vars.HALL_THRESHOLD || '65' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 変更されたエッセイを抽出
        id: files
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1 || true
          files=$(git diff --name-only "$base"...HEAD | grep '^知恵の館/.*\.md$' | grep -vE '(RUBRIC|PROMPT|INDEX|README)' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "対象:"; echo "$files"

      - name: 1次判定 (hall-eval)
        id: gate
        if: steps.files.outputs.files != ''
        run: python3 .github/workflows/pr-gate.py ${{ steps.files.outputs.files }}

      - name: 判定をPRにコメント
        if: always() && steps.files.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const ok = "${{ steps.gate.outcome }}" === "success";
            const body = ok
              ? "✅ **1次判定 PASS** — hall-eval (RUBRIC v2)。読み物として合格、レビューへ。"
              : "❌ **1次判定 NG** — hall-eval スコアが閾値未満のためマージを阻止しました。改善して再送してください。";
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });
